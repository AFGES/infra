name: password-manager

services:
  # PostgreSQL: vaultwarden database, reachable only on the internal backend network
  postgresql:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql
      - database:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint fixes ownership of PGDATA then drops to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # OIDCwarden: Vaultwarden fork with Google Workspace SSO (SSO only, see env/vaultwarden.env)
  vaultwarden:
    image: ghcr.io/timshel/oidcwarden:v2026.9.0-3-alpine@sha256:1a907e4eba84e8f38b3e12fb52bb9579628948b8d8eff24374bb6e23b53e4471
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - env/vaultwarden.env
    environment:
      # Unprivileged port, so no NET_BIND_SERVICE needed
      ROCKET_PORT: 8080
    volumes:
      # attachments, sends, icon cache and rsa_key (JWT signing)
      - data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - backend
    # Publish vault.afges.eu. Clients bypass Pangolin auth; /admin needs Pangolin SSO then ADMIN_TOKEN.
    # Rules are evaluated in order; path patterns match per segment.
    labels:
      - "pangolin.public-resources.vaultwarden.name=vaultwarden"
      - "pangolin.public-resources.vaultwarden.protocol=http"
      - "pangolin.public-resources.vaultwarden.full-domain=vault.afges.eu"
      - "pangolin.public-resources.vaultwarden.auth.sso-enabled=true"
      - "pangolin.public-resources.vaultwarden.rules[0].action=pass"
      - "pangolin.public-resources.vaultwarden.rules[0].match=path"
      - "pangolin.public-resources.vaultwarden.rules[0].value=/admin"
      - "pangolin.public-resources.vaultwarden.rules[1].action=pass"
      - "pangolin.public-resources.vaultwarden.rules[1].match=path"
      - "pangolin.public-resources.vaultwarden.rules[1].value=/admin/*"
      - "pangolin.public-resources.vaultwarden.rules[2].action=allow"
      - "pangolin.public-resources.vaultwarden.rules[2].match=cidr"
      - "pangolin.public-resources.vaultwarden.rules[2].value=0.0.0.0/0"
      - "pangolin.public-resources.vaultwarden.rules[3].action=allow"
      - "pangolin.public-resources.vaultwarden.rules[3].match=cidr"
      - "pangolin.public-resources.vaultwarden.rules[3].value=::/0"
      - "pangolin.public-resources.vaultwarden.targets[0].method=http"
      - "pangolin.public-resources.vaultwarden.targets[0].port=8080"
      - "pangolin.public-resources.vaultwarden.targets[0].healthcheck.port=8080"
      - "pangolin.public-resources.vaultwarden.targets[0].healthcheck.path=/alive"
      - "pangolin.public-resources.vaultwarden.targets[0].healthcheck.status=200"

volumes:
  database: {}
  data: {}

networks:
  default:
    driver: bridge
    name: password-manager
  backend:
    driver: bridge
    name: password-manager-backend
    internal: true
