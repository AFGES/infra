name: n8n

services:
  # PostgreSQL: n8n database, reachable only on the internal backend network
  postgresql:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql
      - database:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint fixes ownership of PGDATA then drops to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  n8n:
    image: docker.io/n8nio/n8n:2.44.5@sha256:bcb4e4917141f4a5249c8eadf2776d347f4c2ede75adfbbc82064826af9a8ead
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - env/n8n.env
    volumes:
      # config (encryption key fallback), binary data, nodes installed from the UI
      - data:/home/node/.n8n
      - ./config/patch.js:/patch.js:ro
      - ./config/public.pem:/etc/ssl/certs/custom-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - backend
    # Publish n8n.afges.eu. Auth is handled by n8n itself (Google Workspace SAML),
    # so Pangolin SSO stays off and webhooks/forms need no bypass rules.
    labels:
      - "pangolin.public-resources.n8n.name=n8n"
      - "pangolin.public-resources.n8n.protocol=http"
      - "pangolin.public-resources.n8n.full-domain=n8n.afges.eu"
      - "pangolin.public-resources.n8n.auth.sso-enabled=false"
      - "pangolin.public-resources.n8n.targets[0].method=http"
      - "pangolin.public-resources.n8n.targets[0].hostname=n8n"
      - "pangolin.public-resources.n8n.targets[0].port=5678"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.hostname=n8n"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.port=5678"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.path=/healthz"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.status=200"

  # Socket proxy: limits Docker API access for Newt (read-only, CONTAINERS+EVENTS only)
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # Newt: Pangolin tunnel client – exposes services through the Pangolin reverse proxy
  newt:
    image: docker.io/fosrl/newt:latest@sha256:3465d85200cceb0f46dad8e63a40b69ec043a81df66ed0c514714302e9b83dde
    container_name: newt
    restart: unless-stopped
    depends_on:
      - socket-proxy
    env_file:
      - env/newt.env
    environment:
      DOCKER_SOCKET: tcp://socket-proxy:2375
    networks:
      - default
      - socket-proxy

volumes:
  database: {}
  data: {}

networks:
  default:
    driver: bridge
    name: n8n
  backend:
    driver: bridge
    name: n8n-backend
    internal: true
  socket-proxy:
    driver: bridge
    name: n8n-socket-proxy
    internal: true
