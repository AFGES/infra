name: n8n

services:
  # PostgreSQL: n8n database, reachable only on the internal backend network
  postgresql:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql
      - database:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint fixes ownership of PGDATA then drops to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  n8n:
    image: docker.io/n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - env/n8n.env
    volumes:
      # config (encryption key fallback), binary data, nodes installed from the UI
      - data:/home/node/.n8n
      - ./config/patch.js:/patch.js:ro
      - ./config/public.pem:/etc/ssl/certs/custom-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - backend
    # Publish n8n.afges.eu. Auth is handled by n8n itself (Google Workspace SAML),
    # so Pangolin SSO stays off and webhooks/forms need no bypass rules.
    labels:
      - "pangolin.public-resources.n8n.name=n8n"
      - "pangolin.public-resources.n8n.protocol=http"
      - "pangolin.public-resources.n8n.full-domain=n8n.afges.eu"
      - "pangolin.public-resources.n8n.auth.sso-enabled=false"
      - "pangolin.public-resources.n8n.targets[0].method=http"
      - "pangolin.public-resources.n8n.targets[0].port=5678"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.port=5678"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.path=/healthz"
      - "pangolin.public-resources.n8n.targets[0].healthcheck.status=200"

volumes:
  database: {}
  data: {}

networks:
  default:
    driver: bridge
    name: n8n
  backend:
    driver: bridge
    name: n8n-backend
    internal: true
