name: auth

# Shared non-secret authentik settings (secrets live in env/*.env)
x-authentik-environment: &authentik-environment
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  # Only trust X-Forwarded-For from the auth network: host newt connects from its gateway 172.30.0.1,
  # so reputation sees real client IPs
  AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 172.30.0.0/24
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

services:
  # PostgreSQL: authentik database, reachable only on the internal backend network
  postgresql:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql
      - database:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint fixes ownership of PGDATA then drops to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # authentik server: web UI, API and flows
  server:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    container_name: authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - env/postgres.env
      - env/authentik.env
    environment: *authentik-environment
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Prometheus metrics, scraped by the monitoring VM over vnet0 only
      - 10.20.0.3:9300:9300
    volumes:
      - data:/data
      - templates:/templates
      - ./config/blueprints:/blueprints/custom:z,ro
      - ./config/public.pem:/authentik/enterprise/public.pem:z,ro
    networks:
      - default
      - backend
    labels:
      - "pangolin.public-resources.authentik.name=authentik"
      - "pangolin.public-resources.authentik.protocol=http"
      - "pangolin.public-resources.authentik.full-domain=auth.afges.eu"
      - "pangolin.public-resources.authentik.targets[0].method=http"
      - "pangolin.public-resources.authentik.targets[0].port=9000"
      - "pangolin.public-resources.authentik.targets[0].healthcheck.port=9000"
      - "pangolin.public-resources.authentik.targets[0].healthcheck.path=/-/health/live/"
      - "pangolin.public-resources.authentik.targets[0].healthcheck.status=200"

  # authentik worker: background tasks, blueprints, outposts
  worker:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - env/postgres.env
      - env/authentik.env
    environment: *authentik-environment
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - data:/data
      - certs:/certs
      - templates:/templates
      - ./config/blueprints:/blueprints/custom:z,ro
      - ./config/public.pem:/authentik/enterprise/public.pem:z,ro
    networks:
      - default
      - backend

volumes:
  database: {}
  data: {}
  certs: {}
  templates: {}

networks:
  default:
    driver: bridge
    name: auth
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    driver: bridge
    name: auth-backend
    internal: true
