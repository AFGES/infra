name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-postgresql-1.16@sha256:2f5b971b2371d3403f0a8e7cd8728af19b8a994f02a333ad434887b5d21e0b85
    container_name: pangolin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - env/pangolin.env
      - env/postgres.env
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    volumes:
      - ./config:/app/config:z
      - traefik_logs:/app/config/logs:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.4.0@sha256:887355e66deac61df9583d9df23e630897f785a8e20bc66081c66e40687cc713
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config:z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80

  traefik:
    image: docker.io/traefik:v3.7@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    env_file:
      - env/traefik.env
    volumes:
      - ./config/traefik:/etc/traefik:z,ro # Volume to store the Traefik configuration
      - traefik_letsencrypt:/letsencrypt:Z # Volume to store the Let's Encrypt certificates
      - traefik_logs:/var/log/traefik:z # Volume to store Traefik logs

  postgres:
    image: docker.io/library/postgres:18@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    container_name: postgres
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
    volumes:
      - ./config/crowdsec:/etc/crowdsec:z
      - crowdsec_db:/var/lib/crowdsec/data:z
      - traefik_logs:/var/log/traefik:z,ro
    ports:
      - 8080:8080 # Local API port for bouncer communication

  # GED Unistra: document management app, exposed via Pangolin
  ged-unistra:
    image: ghcr.io/afges/ged-unistra:0.2@sha256:11efc783ebf3c22f39c1a15813fdd06df5614adddd3ec9ecdd32b990cf03b29d
    container_name: ged-unistra
    restart: unless-stopped
    labels:
      - "pangolin.public-resources.ged-unistra.name=GED Unistra"
      - "pangolin.public-resources.ged-unistra.protocol=http"
      - "pangolin.public-resources.ged-unistra.full-domain=ged-unistra.afges.eu"
      - "pangolin.public-resources.ged-unistra.targets[0].method=http"
      - "pangolin.public-resources.ged-unistra.targets[0].hostname=ged-unistra"
      - "pangolin.public-resources.ged-unistra.targets[0].port=80"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.hostname=ged-unistra"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.port=80"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.path=/health"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.status=200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Socket proxy: limits Docker API access for Newt (read-only, CONTAINERS+EVENTS only)
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # Newt: Pangolin tunnel client – registers labeled services as resources
  newt:
    image: docker.io/fosrl/newt:latest@sha256:3c009663332145cae39b940b07857469038d5e9d71aacb1497e78795ba4e3b9b
    container_name: newt
    restart: unless-stopped
    depends_on:
      - socket-proxy
    env_file:
      - env/newt.env
    environment:
      DOCKER_SOCKET: tcp://socket-proxy:2375
    networks:
      - default
      - socket-proxy

volumes:
  traefik_letsencrypt:
  traefik_logs:
  postgres_data:
  crowdsec_db:

networks:
  default:
    driver: bridge
    name: pangolin
  socket-proxy:
    driver: bridge
    name: pangolin-socket-proxy
    internal: true
