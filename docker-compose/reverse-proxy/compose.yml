name: pangolin

# Common hardening: log rotation and no privilege escalation via setuid binaries
x-hardening: &hardening
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-postgresql-1.16@sha256:2f5b971b2371d3403f0a8e7cd8728af19b8a994f02a333ad434887b5d21e0b85
    container_name: pangolin
    <<: *hardening
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - env/pangolin.env
      - env/postgres.env
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 200
        reservations:
          memory: 256m
    volumes:
      - ./config:/app/config:z
      - traefik_logs:/app/config/logs:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15
    networks:
      - default
      - db

  gerbil:
    image: docker.io/fosrl/gerbil:1.5.2@sha256:1f6e64eaba7997282c7067ba19922fc7e46b5f73e1a27add3dd66a591d50512f
    container_name: gerbil
    <<: *hardening
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      # WireGuard key on the persistent disk: a new key registers a new exit node
      - gerbil_config:/var/config:Z
    # wireguard module is loaded by the host (tofu: kernel_modules), no SYS_MODULE needed
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 200
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 443:443/udp
      - 80:80

  traefik:
    image: docker.io/traefik:v3.7@sha256:6d3e069ee484ab1da5adfdda555a75eb9b1545ef09096a0cc7c3043101986a20
    container_name: traefik
    <<: *hardening
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    env_file:
      - env/traefik.env
    labels:
      - "pangolin.public-resources.traefik.name=Traefik"
      - "pangolin.public-resources.traefik.protocol=http"
      - "pangolin.public-resources.traefik.full-domain=traefik.afges.eu"
      - "pangolin.public-resources.traefik.auth.sso-enabled=true"
      - "pangolin.public-resources.traefik.targets[0].method=http"
      - "pangolin.public-resources.traefik.targets[0].port=8080"
      - "pangolin.public-resources.traefik.targets[0].healthcheck.port=8080"
      - "pangolin.public-resources.traefik.targets[0].healthcheck.path=/api/overview"
      - "pangolin.public-resources.traefik.targets[0].healthcheck.status=200"
    volumes:
      - ./config/traefik:/etc/traefik:z,ro # Volume to store the Traefik configuration
      - traefik_letsencrypt:/letsencrypt:Z # Volume to store the Let's Encrypt certificates
      - traefik_logs:/var/log/traefik:z # Volume to store Traefik logs
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 200

  # Rotates the Traefik access log (copytruncate: Traefik appends, CrowdSec handles truncation)
  logrotate:
    image: docker.io/library/busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    container_name: logrotate
    <<: *hardening
    restart: unless-stopped
    init: true # sh as PID 1 ignores SIGTERM
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    environment:
      MAX_BYTES: 52428800 # 50 MiB
    volumes:
      - traefik_logs:/var/log/traefik:z
    deploy:
      resources:
        limits:
          memory: 32m
          pids: 20
    command:
      - /bin/sh
      - -c
      - |
        cd /var/log/traefik || exit 1
        while true; do
          if [ -f access.log ] && [ "$$(stat -c %s access.log)" -gt "$$MAX_BYTES" ]; then
            rm -f access.log.3.gz
            if [ -f access.log.2.gz ]; then mv access.log.2.gz access.log.3.gz; fi
            if [ -f access.log.1.gz ]; then mv access.log.1.gz access.log.2.gz; fi
            cp access.log access.log.1 && : > access.log
            gzip -f access.log.1
          fi
          sleep 600
        done

  postgres:
    image: docker.io/library/postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    container_name: postgres
    <<: *hardening
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql:Z
    cap_drop:
      - ALL
    cap_add: # entrypoint chowns the data dir, then drops to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db # Reachable by pangolin only

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    <<: *hardening
    restart: unless-stopped
    env_file:
      - env/crowdsec.env # BOUNCER_KEY_traefik: registers the Traefik bouncer key
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
    volumes:
      - ./config/crowdsec:/etc/crowdsec:z
      - crowdsec_db:/var/lib/crowdsec/data:z
      - traefik_logs:/var/log/traefik:z,ro
    deploy:
      resources:
        limits:
          memory: 768m
          pids: 200
    # LAPI (8080) and AppSec (7422) stay on the internal network
    ports:
      # Prometheus metrics, scraped by the monitoring VM over vnet0 only
      - 10.20.0.1:6060:6060
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CrowdSec Web UI: alerts and decisions, exposed via Pangolin
  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.8@sha256:1e7ef2ddb701c8610301787c9ed476b57184ec5f5e839db804fbb4da3dccc17f
    container_name: crowdsec-web-ui
    <<: *hardening
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
    env_file:
      - env/crowdsec_web_ui.env
    environment:
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      # Watcher machine, registered once with `cscli machines add crowdsec-web-ui`
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_METRICS_URL: http://crowdsec:6060/metrics
      CONFIG_AUTH_ENABLED: "true"
    volumes:
      - crowdsec_web_ui:/app/data
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 200
    labels:
      - "pangolin.public-resources.crowdsec.name=CrowdSec"
      - "pangolin.public-resources.crowdsec.protocol=http"
      - "pangolin.public-resources.crowdsec.full-domain=crowdsec.afges.eu"
      - "pangolin.public-resources.crowdsec.auth.sso-enabled=true"
      - "pangolin.public-resources.crowdsec.targets[0].method=http"
      - "pangolin.public-resources.crowdsec.targets[0].port=3000"
      - "pangolin.public-resources.crowdsec.targets[0].healthcheck.port=3000"
      - "pangolin.public-resources.crowdsec.targets[0].healthcheck.path=/api/health"
      - "pangolin.public-resources.crowdsec.targets[0].healthcheck.status=200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # GED Unistra: document management app, exposed via Pangolin
  ged-unistra:
    image: ghcr.io/afges/ged-unistra:0.2@sha256:11efc783ebf3c22f39c1a15813fdd06df5614adddd3ec9ecdd32b990cf03b29d
    container_name: ged-unistra
    <<: *hardening
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 200
    labels:
      - "pangolin.public-resources.ged-unistra.name=GED Unistra"
      - "pangolin.public-resources.ged-unistra.protocol=http"
      - "pangolin.public-resources.ged-unistra.full-domain=ged-unistra.afges.eu"
      - "pangolin.public-resources.ged-unistra.targets[0].method=http"
      - "pangolin.public-resources.ged-unistra.targets[0].port=80"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.port=80"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.path=/health"
      - "pangolin.public-resources.ged-unistra.targets[0].healthcheck.status=200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gerbil_config:
  traefik_letsencrypt:
  traefik_logs:
  postgres_data:
  crowdsec_db:
  crowdsec_web_ui:

networks:
  default:
    driver: bridge
    name: pangolin
  db:
    driver: bridge
    name: pangolin-db
    internal: true
