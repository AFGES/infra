---
- name: Deploy rclone config
  ansible.builtin.template:
      src: rclone.conf.j2
      dest: "{{ pbs_rclone_s3_config_dir }}/rclone.conf"
      owner: root
      group: root
      mode: "0600"
  notify: Reload systemd and restart rclone-s3
  no_log: true

# All SA key fields are strings; YAML may parse e.g. client_id as a number
- name: Deploy Google service account key
  ansible.builtin.copy:
      content: "{{ dict(pbs_rclone_s3_secrets.gdrive_service_account.keys() | zip(pbs_rclone_s3_secrets.gdrive_service_account.values() | map('string'))) | to_nice_json }}\n"
      dest: "{{ pbs_rclone_s3_config_dir }}/gdrive-sa.json"
      owner: root
      group: root
      mode: "0600"
  notify: Reload systemd and restart rclone-s3
  no_log: true

# CSV-quoted for RCLONE_AUTH_KEY: one "accessKey,secretKey" pair
- name: Deploy S3 auth key
  ansible.builtin.copy:
      content: "\"{{ pbs_rclone_s3_secrets.s3_access_key }},{{ pbs_rclone_s3_secrets.s3_secret_key }}\"\n"
      dest: "{{ pbs_rclone_s3_config_dir }}/auth-key"
      owner: root
      group: root
      mode: "0600"
  notify: Reload systemd and restart rclone-s3
  no_log: true
