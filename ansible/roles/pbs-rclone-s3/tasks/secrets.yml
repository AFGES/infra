---
- name: Check required variables
  ansible.builtin.assert:
      that:
          - pbs_rclone_s3_shared_drive_id | length > 0
          - pbs_rclone_s3_version is version('1.65', '>=')
      fail_msg: "Set pbs_rclone_s3_shared_drive_id; rclone serve s3 needs >= 1.65"
      quiet: true

- name: Load rclone-s3 secrets
  ansible.builtin.set_fact:
      pbs_rclone_s3_secrets: "{{ lookup('community.sops.sops', pbs_rclone_s3_secrets_file) | from_yaml }}"
  no_log: true

- name: Check secrets content
  ansible.builtin.assert:
      that:
          - pbs_rclone_s3_secrets.gdrive_service_account is mapping
          - pbs_rclone_s3_secrets.crypt_password_obscured | length > 0
          - pbs_rclone_s3_secrets.crypt_password2_obscured | length > 0
          - pbs_rclone_s3_secrets.s3_access_key | length > 0
          - pbs_rclone_s3_secrets.s3_secret_key | length > 0
          - "',' not in pbs_rclone_s3_secrets.s3_access_key ~ pbs_rclone_s3_secrets.s3_secret_key"
          - "'\"' not in pbs_rclone_s3_secrets.s3_access_key ~ pbs_rclone_s3_secrets.s3_secret_key"
      fail_msg: "Missing or invalid key in {{ pbs_rclone_s3_secrets_file }} (see README)"
      quiet: true
  no_log: true
