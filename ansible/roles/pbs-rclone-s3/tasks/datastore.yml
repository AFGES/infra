---
- name: List PBS datastores
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: pbs_datastores
  changed_when: false

- name: Create PBS datastore on rclone-s3
  ansible.builtin.command:
      argv:
          - proxmox-backup-manager
          - datastore
          - create
          - "{{ pbs_rclone_s3_datastore_name }}"
          - "{{ pbs_rclone_s3_datastore_cache_path }}"
          - --backend
          - "type=s3,client={{ pbs_rclone_s3_pbs_endpoint_id }},bucket={{ pbs_rclone_s3_bucket }}"
  changed_when: true
  when: pbs_rclone_s3_datastore_name not in (pbs_datastores.stdout | from_json | map(attribute='name'))
