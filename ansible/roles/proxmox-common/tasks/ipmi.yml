---
- name: Install FreeIPMI tools
  ansible.builtin.apt:
      name: freeipmi
      state: present
      update_cache: yes

- name: Get latest release of ipmi_exporter
  community.general.github_release:
      user: prometheus-community
      repo: ipmi_exporter
      action: latest_release
  register: ipmi_exporter_release
  delegate_to: localhost
  become: false
  run_once: true

- name: Download ipmi_exporter from GitHub
  ansible.builtin.get_url:
      url: "https://github.com/prometheus-community/ipmi_exporter/releases/download/{{ ipmi_exporter_release.tag }}/ipmi_exporter-{{ ipmi_exporter_release.tag | regex_replace('^v', '') }}.linux-amd64.tar.gz"
      dest: /tmp/ipmi_exporter.tar.gz
      mode: "0644"

- name: Extract ipmi_exporter binary
  ansible.builtin.unarchive:
      src: /tmp/ipmi_exporter.tar.gz
      remote_src: yes
      dest: /usr/local/bin
      include:
          - "ipmi_exporter-{{ ipmi_exporter_release.tag | regex_replace('^v', '') }}.linux-amd64/ipmi_exporter"
      extra_opts:
          - --strip-components=1

- name: Remove ipmi_exporter archive
  ansible.builtin.file:
      path: /tmp/ipmi_exporter.tar.gz
      state: absent

- name: Deploy ipmi_exporter systemd unit
  ansible.builtin.copy:
      src: ipmi_exporter.service
      dest: /etc/systemd/system/ipmi_exporter.service
      owner: root
      group: root
      mode: "0644"
  notify: Reload systemd and restart ipmi_exporter

- name: Enable and start ipmi_exporter
  ansible.builtin.systemd:
      name: ipmi_exporter
      enabled: true
      state: started
      daemon_reload: true
