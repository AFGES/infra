---
- name: Install unattended-upgrades and apt-listchanges
  ansible.builtin.apt:
      name:
          - unattended-upgrades
          - apt-listchanges
      state: present
      update_cache: yes

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
      content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      dest: /etc/apt/apt.conf.d/20auto-upgrades
      owner: root
      group: root
      mode: "0644"

- name: Restrict unattended upgrades to Debian security updates
  ansible.builtin.template:
      src: 52unattended-upgrades-local.j2
      dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
      owner: root
      group: root
      mode: "0644"

- name: Enable and start unattended-upgrades
  ansible.builtin.systemd:
      name: unattended-upgrades
      enabled: true
      state: started
  ignore_errors: "{{ ansible_check_mode }}"
