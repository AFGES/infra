global:
  scrape_interval: 15s

scrape_configs:
  # Scrape vmagent itself
  - job_name: "vmagent"
    static_configs:
      - targets: ["vmagent:8429"]

  # Scrape VictoriaMetrics itself
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["victoriametrics:8428"]

  # Scrape vmalert
  - job_name: "vmalert"
    static_configs:
      - targets: ["vmalert:8880"]

  # Scrape alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # PVE nodes — using Prometheus Node Exporter (port 9100)
  - job_name: "pve-nodes"
    static_configs:
      - targets:
          - "192.168.1.102:9100"  # pve-node-1
          - "192.168.1.104:9100"  # pve-node-2
          - "192.168.1.106:9100"  # pve-node-3
        labels:
          environment: "pve"

  # PVE metrics via pve-exporter (port 9221) — multi-target pattern
  - job_name: "pve-exporter"
    static_configs:
      - targets:
          - "192.168.1.102"  # pve-node-1
          - "192.168.1.104"  # pve-node-2
          - "192.168.1.106"  # pve-node-3
        labels:
          environment: "pve"
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
